name: Pubblica Brogliaccio su GitHub Pages

on:
  push:
    branches: [master, dev]
    paths:
      - 'tools/appunti-cantiere/**'
      - '.github/workflows/brogliaccio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica la cartella di Brogliaccio come artefatto
        uses: actions/upload-pages-artifact@v4
        with:
          path: tools/appunti-cantiere

      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
